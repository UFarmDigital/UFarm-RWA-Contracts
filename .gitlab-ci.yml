image: docker:29.1.4

services:
  - docker:29.1.4-dind

stages:
  - test
  - build

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  DOCKER_CERT_PATH: "/certs/client"

.build: &build
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - docker build -t $CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA} -t $CI_REGISTRY_IMAGE:${ENV_TAG} .
    - docker push --all-tags $CI_REGISTRY_IMAGE

build-latest:
  stage: build
  variables:
    ENV_TAG: latest
  <<: *build
  only:
    - master

build-prod:
  stage: build
  variables:
    ENV_TAG: $CI_COMMIT_TAG
  <<: *build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
