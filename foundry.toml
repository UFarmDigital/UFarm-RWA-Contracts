[profile.default]
src = "contracts"
test = "test"
out = "out"
cache_path = "cache_forge"
libs = ["node_modules"]
solc_version = "0.8.35"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
via_ir = true
auto_detect_remappings = false
remappings = ["@openzeppelin/=node_modules/@openzeppelin/"]
